<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CDM 2026 · Pronostics</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.pronos-layout{display:flex;flex-direction:column;height:100%}
.filter-zone{flex-shrink:0;padding:10px 14px 6px;background:var(--bg)}
.matches-zone{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 14px calc(var(--nav-h)+14px)}
.matches-zone::-webkit-scrollbar{width:4px}
.matches-zone::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}

/* Onglets principaux */
.main-tabs{display:flex;border-bottom:2px solid var(--bd);margin-bottom:10px}
.mtab{flex:1;padding:9px 4px;font-size:.8rem;font-weight:700;cursor:pointer;border:none;background:none;color:var(--t2);font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;border-bottom:2.5px solid transparent;margin-bottom:-2px;transition:all .15s}
.mtab i{font-size:.95rem}
.mtab.active{color:var(--g);border-bottom-color:var(--g)}
.mtab .cnt{background:var(--bd);color:var(--t2);font-size:.6rem;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:2px}
.mtab.active .cnt{background:var(--g-l);color:var(--g-d)}

/* Segmented control par date / par groupe */
.mode-toggle{display:flex;background:var(--bd);border-radius:10px;padding:3px;margin-bottom:10px}
.mode-btn{flex:1;padding:7px 8px;border-radius:8px;font-size:.75rem;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--t2);font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s}
.mode-btn i{font-size:.88rem}
.mode-btn.active{background:var(--surf);color:var(--g);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* Navigation par date ← → */
.date-nav{display:flex;align-items:center;gap:6px;background:var(--surf);border:1.5px solid var(--bd);border-radius:var(--r-sm);padding:6px 8px;margin-bottom:4px}
.date-nav.closed{border-color:#fca5a5;background:#fff5f5}
.dnav-btn{background:var(--bg);border:1px solid var(--bd);color:var(--t2);border-radius:8px;padding:0;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem;flex-shrink:0;transition:all .15s}
.dnav-btn:hover:not(:disabled){background:var(--g-l);border-color:var(--g);color:var(--g)}
.dnav-btn:disabled{opacity:.3;cursor:default}
.dnav-center{flex:1;text-align:center;min-width:0}
.dnav-date{font-size:.95rem;font-weight:700;color:var(--t)}
.dnav-date.closed{color:#dc2626}
.dnav-sub{font-size:.7rem;color:var(--t2);margin-top:1px}
.dnav-progress{font-size:.68rem;color:var(--t2);margin-top:1px}

/* Pills pour le mode groupe */
.phase-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin-bottom:4px}
.phase-pills::-webkit-scrollbar{display:none}
.ppill{padding:5px 11px;border-radius:20px;font-size:.72rem;font-weight:700;border:1.5px solid var(--bd);background:var(--surf);color:var(--t2);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .12s;font-family:inherit}
.ppill.active{background:var(--g);border-color:var(--g);color:#fff}

/* Bannière date fermée */
.closed-banner{background:#fee2e2;border:1.5px solid #fca5a5;border-radius:var(--r-sm);padding:9px 12px;margin-bottom:8px;font-size:.78rem;color:#991b1b;display:flex;align-items:center;gap:7px}

/* Résumé terminés */
.pts-summary{background:linear-gradient(135deg,var(--g-d),var(--g));border-radius:var(--r);padding:16px;margin-bottom:14px;display:flex;align-items:center;gap:14px;color:#fff}
.pts-big{font-size:2.5rem;font-weight:800;line-height:1;flex-shrink:0}
.pts-info-title{font-size:.88rem;font-weight:700;margin-bottom:2px}
.pts-info-sub{font-size:.75rem;opacity:.8}

/* Carte match terminé */
.done-card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:7px}
.done-teams{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.done-team-name{flex:1;font-weight:600;font-size:.82rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.done-team-name:last-child{text-align:right}
.done-score{font-size:1rem;font-weight:800;flex-shrink:0;white-space:nowrap}
.done-footer{display:flex;align-items:center;justify-content:space-between;font-size:.72rem;color:var(--t2)}
.done-prono-val{background:var(--bg);border-radius:5px;padding:2px 7px;font-weight:600;color:var(--t);font-size:.72rem}

/* ── Deadline d'un match ── */
.match-deadline{
  text-align:center;font-size:.7rem;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:5px;
  margin-top:6px;padding-top:8px;border-top:1px solid var(--bd);
}
.match-card.deadline-today{
  border-color:#fca5a5;
  background:linear-gradient(135deg,#fff5f5,var(--surf));
}

/* ── Layout carte match redesigné (mobile-first) ── */
.match-body{display:flex;flex-direction:column;gap:10px}
.match-teams{display:flex;align-items:center;gap:6px;min-width:0}
.match-teams .team{
  flex:1;font-size:.9rem;font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  min-width:0;line-height:1.3;
}
.match-teams .team-r{text-align:right}
.teams-vs{font-size:.72rem;font-weight:600;color:var(--t2);flex-shrink:0;padding:0 2px}
.match-score-row{display:flex;align-items:center;justify-content:center;gap:8px}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="page-wrap">
  <header class="app-hdr">
    <div class="app-hdr-logo">
      <i class="ti ti-pencil" style="font-size:1.1rem;opacity:.8"></i>
      Mes pronostics
    </div>
    <span id="sync-badge" class="badge b-sync"><span class="spin"></span></span>
    <span id="user-badge" class="badge b-green"></span>
    <button class="btn btn-ghost btn-sm" onclick="logout()" style="padding:6px 10px;min-height:32px;border-radius:8px">
      <i class="ti ti-logout"></i>
    </button>
  </header>
  <div class="page-content" style="padding:0">
    <div class="pronos-layout" id="pronos-layout">
      <div style="display:flex;align-items:center;justify-content:center;height:100%">
        <span class="spin" style="border-top-color:var(--g);border-color:rgba(0,0,0,.1);width:24px;height:24px;border-width:3px"></span>
      </div>
    </div>
  </div>
  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

<script src="app.js?v=5"></script>
<script>
let mainTab   = 'ajouer'; // 'ajouer' | 'termines'
let filterMode= 'date';   // 'date' | 'groupe'
let activePhase = 'Groupe A';
let activeDate  = '';
let allDates    = [];      // liste globale des dates disponibles

(async function(){
  if(!requireUser())return;
  updateUserBadge();
  buildNav('pronos');
  try{
    st = await sbReadAll();
    setSyncBadge(true);
    buildLayout();
    startPolling(renderMatches);
  }catch(e){
    setSyncBadge(false);
    document.getElementById('pronos-layout').innerHTML =
      '<div class="empty-state"><i class="ti ti-wifi-off"></i>Erreur de connexion</div>';
  }
})();

/* ── Formatage date ────────────────────────────────────────── */
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MOIS_COURT = ['jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov','déc'];

// Calcule la date/heure limite pour un match : 2h avant le coup d'envoi
function pronoDeadline(m){
  if(!m||!m.date)return null;
  if(m.time){
    const matchDT=new Date(m.date+'T'+m.time.slice(0,5)+':00');
    if(!isNaN(matchDT.getTime())){
      const lockDT=new Date(matchDT.getTime()-2*3600000);
      const h=lockDT.getHours(),min=lockDT.getMinutes();
      const timeStr=min===0?`${h}h`:`${S2(h)}h${S2(min)}`;
      return{str:`${lockDT.getDate()} ${MOIS_COURT[lockDT.getMonth()]} à ${timeStr}`,dt:lockDT};
    }
  }
  // Fallback sans heure : J-2 à 23h59
  const [y,mo,d]=m.date.split('-').map(Number);
  const dl=new Date(y,mo-1,d-2);
  return{
    str:`${dl.getDate()} ${MOIS_COURT[dl.getMonth()]} à 23h59`,
    dt:new Date(dl.getFullYear(),dl.getMonth(),dl.getDate(),23,59)
  };
}
// Urgence selon le temps restant avant la limite
function deadlineUrgency(dlDt){
  if(!(dlDt instanceof Date))return 'normal';
  const diffH=(dlDt-new Date())/3600000;
  if(diffH<2)return 'urgent';   // moins de 2h
  if(diffH<24)return 'soon';    // moins de 24h
  return 'normal';
}
function fmtDateLong(d){
  if(!d)return '';
  const [,m,j]=d.split('-');
  return `${+j} ${MOIS[parseInt(m)-1]}`;
}
function fmtDateCourt(d){
  if(!d)return '';
  const [,m,j]=d.split('-');
  return `${+j} ${MOIS_COURT[parseInt(m)-1]}`;
}
function isDateClosed(d){ return d && today() >= d; }
function bestDate(dates){
  const t=today();
  if(dates.includes(t))return t;
  const fut=dates.filter(d=>d>t);
  if(fut.length)return fut[0];
  return dates[dates.length-1]||'';
}

/* ── Construction du layout ────────────────────────────────── */
function buildLayout(){
  const pending = getMatches().filter(m=>m.homeScore==null);
  const done    = getMatches().filter(m=>m.homeScore!=null);

  const mainTabsHtml = `<div class="main-tabs">
    <button class="mtab${mainTab==='ajouer'?' active':''}" onclick="switchMain('ajouer')">
      <i class="ti ti-pencil"></i> À jouer<span class="cnt">${pending.length}</span>
    </button>
    <button class="mtab${mainTab==='termines'?' active':''}" onclick="switchMain('termines')">
      <i class="ti ti-check"></i> Terminés<span class="cnt">${done.length}</span>
    </button>
  </div>`;

  if(mainTab==='termines'){
    document.getElementById('pronos-layout').innerHTML=
      `<div class="filter-zone">${mainTabsHtml}</div>
       <div class="matches-zone" id="matches-zone"></div>`;
    renderDone();
    return;
  }

  if(!pending.length){
    document.getElementById('pronos-layout').innerHTML=
      `<div class="filter-zone">${mainTabsHtml}</div>
       <div class="matches-zone"><div class="empty-state"><i class="ti ti-trophy"></i>Tous les matchs sont terminés !</div></div>`;
    return;
  }

  /* ── Mode "par date" ─────────────────────────────────────── */
  if(filterMode==='date'){
    // Toutes les dates qui ont encore des matchs à jouer
    allDates = [...new Set(pending.map(m=>m.date).filter(Boolean))].sort();
    if(!allDates.includes(activeDate)) activeDate = bestDate(allDates);

    const idx     = allDates.indexOf(activeDate);
    const closed  = isDateClosed(activeDate);
    const nToday  = pending.filter(m=>m.date===activeDate).length;
    const total   = allDates.length;

    const dateNavHtml = `<div class="date-nav${closed?' closed':''}">
      <button class="dnav-btn" onclick="prevDate()" ${idx<=0?'disabled':''}>
        <i class="ti ti-chevron-left"></i>
      </button>
      <div class="dnav-center">
        <div class="dnav-date${closed?' closed':''}">${fmtDateLong(activeDate)}</div>
        <div class="dnav-sub">${nToday} match${nToday>1?'s':''} · jour ${idx+1}/${total}${closed?' · 🔒 Fermé':''}</div>
      </div>
      <button class="dnav-btn" onclick="nextDate()" ${idx>=allDates.length-1?'disabled':''}>
        <i class="ti ti-chevron-right"></i>
      </button>
    </div>`;

    document.getElementById('pronos-layout').innerHTML=
      `<div class="filter-zone">
        ${mainTabsHtml}
        <div class="mode-toggle">
          <button class="mode-btn active"><i class="ti ti-calendar"></i> Par date</button>
          <button class="mode-btn" onclick="setMode('groupe')"><i class="ti ti-layout-grid"></i> Par groupe</button>
        </div>
        ${dateNavHtml}
       </div>
       <div class="matches-zone" id="matches-zone"></div>`;

  /* ── Mode "par groupe" ───────────────────────────────────── */
  }else{
    const grouped={};
    pending.forEach(m=>{if(!grouped[m.phase])grouped[m.phase]=[];grouped[m.phase].push(m)});
    const availPhases = PHASES.filter(ph=>grouped[ph]);
    if(!availPhases.includes(activePhase)) activePhase = availPhases[0]||'Groupe A';

    const pillsHtml = availPhases.map(ph=>
      `<button class="ppill${ph===activePhase?' active':''}" data-val="${esc(ph)}" onclick="switchGroup('${esc(ph)}')">${esc(ph)}</button>`
    ).join('');

    document.getElementById('pronos-layout').innerHTML=
      `<div class="filter-zone">
        ${mainTabsHtml}
        <div class="mode-toggle">
          <button class="mode-btn" onclick="setMode('date')"><i class="ti ti-calendar"></i> Par date</button>
          <button class="mode-btn active"><i class="ti ti-layout-grid"></i> Par groupe</button>
        </div>
        <div class="phase-pills" id="filter-pills">${pillsHtml}</div>
       </div>
       <div class="matches-zone" id="matches-zone"></div>`;

    setTimeout(()=>{
      const a=document.querySelector('.ppill.active');
      if(a)a.scrollIntoView({behavior:'auto',inline:'center',block:'nearest'});
    },40);
  }

  renderMatches();
}

/* ── Navigation dates ←→ ──────────────────────────────────── */
function prevDate(){
  const idx=allDates.indexOf(activeDate);
  if(idx>0){ activeDate=allDates[idx-1]; buildLayout(); }
}
function nextDate(){
  const idx=allDates.indexOf(activeDate);
  if(idx<allDates.length-1){ activeDate=allDates[idx+1]; buildLayout(); }
}

/* ── Changements mode / onglet ────────────────────────────── */
function switchMain(tab){ mainTab=tab; buildLayout(); }
function setMode(mode){ filterMode=mode; buildLayout(); }
function switchGroup(ph){
  activePhase=ph;
  document.querySelectorAll('#filter-pills .ppill').forEach(b=>b.classList.toggle('active',b.dataset.val===ph));
  document.getElementById('matches-zone')?.scrollTo(0,0);
  renderMatches();
}

/* ── Render matches "À jouer" ─────────────────────────────── */
function renderMatches(){
  const zone=document.getElementById('matches-zone');
  if(!zone)return;

  let matches;
  if(filterMode==='date'){
    matches=getMatches().filter(m=>m.homeScore==null&&m.date===activeDate);
  }else{
    matches=getMatches().filter(m=>m.homeScore==null&&m.phase===activePhase);
  }

  if(!matches.length){
    zone.innerHTML='<div class="empty-state"><i class="ti ti-calendar-check"></i>Aucun match à jouer ici</div>';
    return;
  }

  const prons=getProns();
  let html='';

  // Bannière si date passée
  if(filterMode==='date'&&isDateClosed(activeDate)){
    html+=`<div class="closed-banner">
      <i class="ti ti-lock"></i>
      <strong>Pronostics fermés</strong> — le ${fmtDateLong(activeDate)} est passé.
    </div>`;
  }

  // En mode date, grouper par phase si plusieurs phases le même jour
  if(filterMode==='date'){
    const grp={};
    matches.forEach(m=>{if(!grp[m.phase])grp[m.phase]=[];grp[m.phase].push(m)});
    const phases=PHASES.filter(ph=>grp[ph]);
    phases.forEach(ph=>{
      if(phases.length>1)
        html+=`<div class="phase-hdr"><i class="ti ti-circle-filled" style="font-size:.4rem"></i>${esc(ph)}</div>`;
      html+=grp[ph].map(m=>renderMatchCard(m,prons)).join('');
    });
  }else{
    html+=matches.map(m=>renderMatchCard(m,prons)).join('');
  }

  zone.innerHTML=html;
}

/* ── Carte match individuelle ─────────────────────────────── */
function renderMatchCard(m,prons){
  const key=user.id+'_'+m.id;
  const p=prons[key]||{};
  const ed=isEditable(m);
  const played=m.homeScore!=null;
  const pts=played?calcPts(p,m):null;
  const cls=pts===5?'p3':pts===3?'p2':pts===1?'p1':'p0';
  const chip=pts!=null?`<span class="pts-chip ${cls}">${pts}pt${pts!==1?'s':''}</span>`:'';
  const realSc=played?`<span style="font-size:.67rem;color:var(--t2)">(${m.homeScore}–${m.awayScore})</span>`:'';
  const meta=`${esc(m.date)} ${esc(m.time)} · ${esc(m.venue)}`;

  // Ligne équipes commune aux deux états
  const teamsRow=`<div class="match-teams">
    <div class="team">${teamLabel(m.home)}</div>
    <span class="teams-vs">vs</span>
    <div class="team team-r">${teamLabel(m.away)}</div>
  </div>`;

  if(ed){
    const dl=pronoDeadline(m);
    const urgency=dl?deadlineUrgency(dl.dt):'normal';
    const dlColor=urgency==='urgent'?'var(--red)':urgency==='soon'?'var(--gold)':'var(--t2)';
    const dlIcon=urgency==='urgent'?'ti-alert-triangle':urgency==='soon'?'ti-clock':'ti-calendar-time';
    const dlText=urgency==='urgent'
      ?`<strong style="color:var(--red)">Ferme bientôt !</strong> Limite : ${dl.str}`
      :urgency==='soon'
        ?`Limite aujourd'hui : ${dl.str}`
        :dl?`Limite : ${dl.str}`:'';
    return`<div class="match-card${urgency==='urgent'?' deadline-today':''}">
      <div class="match-meta"><i class="ti ti-calendar" style="font-size:.75rem"></i>${meta}</div>
      <div class="match-body">
        ${teamsRow}
        <div class="match-score-row">
          <input class="sinput" type="number" inputmode="numeric" min="0" max="20"
            value="${p.homeScore!=null?p.homeScore:''}" placeholder="?"
            onchange="savePron('${m.id}','home',this.value)" id="ph-${m.id}">
          <span class="ssep">–</span>
          <input class="sinput" type="number" inputmode="numeric" min="0" max="20"
            value="${p.awayScore!=null?p.awayScore:''}" placeholder="?"
            onchange="savePron('${m.id}','away',this.value)" id="pa-${m.id}">
        </div>
        ${dlText?`<div class="match-deadline" style="color:${dlColor}">
          <i class="ti ${dlIcon}" style="font-size:.78rem"></i>${dlText}
        </div>`:''}
      </div>
    </div>`;
  }else{
    const sc=p.homeScore!=null
      ?`<span class="sval">${p.homeScore}–${p.awayScore}</span>${realSc}`
      :`<span class="sval" style="color:var(--t2);font-size:.9rem">–</span>`;
    return`<div class="match-card${played?' played':' locked'}">
      <div class="match-meta">
        <i class="ti ti-${played?'circle-check':'lock'}" style="font-size:.75rem"></i>${meta}${chip}
      </div>
      <div class="match-body">
        ${teamsRow}
        <div class="match-score-row">${sc}</div>
      </div>
    </div>`;
  }
}

/* ── Render "Terminés" ────────────────────────────────────── */
function renderDone(){
  const zone=document.getElementById('matches-zone');
  if(!zone)return;
  const prons=getProns();
  const done=getMatches().filter(m=>m.homeScore!=null);
  if(!done.length){
    zone.innerHTML='<div class="empty-state"><i class="ti ti-clock"></i>Aucun match terminé pour l\'instant.</div>';
    return;
  }
  let total=0;
  done.forEach(m=>{ const pts=calcPts(prons[user.id+'_'+m.id],m); if(pts)total+=pts; });

  let html=`<div class="pts-summary">
    <div class="pts-big">${total}</div>
    <div>
      <div class="pts-info-title">points sur ${done.length} match${done.length>1?'s':''} joué${done.length>1?'s':''}</div>
      <div class="pts-info-sub">Pronostics de matchs terminés</div>
    </div>
  </div>`;

  const grp={};
  done.forEach(m=>{if(!grp[m.phase])grp[m.phase]=[];grp[m.phase].push(m)});
  PHASES.filter(ph=>grp[ph]).forEach(ph=>{
    html+=`<div class="phase-hdr"><i class="ti ti-circle-filled" style="font-size:.4rem"></i>${esc(ph)}</div>`;
    grp[ph].forEach(m=>{
      const p=prons[user.id+'_'+m.id]||{};
      const pts=calcPts(p,m);
      const cls=pts===5?'p3':pts===3?'p2':pts===1?'p1':'p0';
      const chip=pts!=null?`<span class="pts-chip ${cls}">${pts}pt${pts!==1?'s':''}</span>`:'';
      const prono=p.homeScore!=null
        ?`<span class="done-prono-val">${p.homeScore}–${p.awayScore}</span>`
        :`<em style="color:var(--t2);font-size:.72rem">Non renseigné</em>`;
      html+=`<div class="done-card">
        <div class="done-teams">
          <div class="done-team-name">${teamLabel(m.home)}</div>
          <span class="done-score">${m.homeScore} – ${m.awayScore}</span>
          <div class="done-team-name">${teamLabel(m.away)}</div>
        </div>
        <div class="done-footer">
          <span style="display:flex;align-items:center;gap:5px">
            <i class="ti ti-pencil" style="font-size:.72rem"></i>${prono}
          </span>
          <span style="display:flex;align-items:center;gap:5px">${chip}<span>${fmtDateCourt(m.date)}</span></span>
        </div>
      </div>`;
    });
  });
  zone.innerHTML=html;
}

/* ── Sauvegarde ───────────────────────────────────────────── */
async function savePron(mid,side,val){
  const pid=user.id, key=pid+'_'+mid;
  if(!st.pronostics)st.pronostics={};
  const cur=st.pronostics[key]||{};
  const upd={...cur,participantId:pid,matchId:mid,homeScore:cur.homeScore??null,awayScore:cur.awayScore??null};
  upd[side+'Score']=val===''?null:+val;
  st.pronostics[key]=upd;
  if(upd.homeScore!=null&&upd.awayScore!=null){
    try{
      await sbUpsert('pronostics',{id:key,participantid:pid,matchid:mid,homescore:upd.homeScore,awayscore:upd.awayScore});
      toast('Pronostic sauvegardé ✓','ok');
    }catch(e){toast(e.message,'ko');}
  }
}
</script>
