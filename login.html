<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CDM 2026 · Connexion</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.login-page{
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:linear-gradient(160deg,#15803d 0%,#166534 55%,#14532d 100%);
  overflow:hidden;
}
.login-hero-zone{
  flex-shrink:0;
  padding:36px 20px 20px;
  text-align:center;
  color:#fff;
}
.login-hero-zone .trophy{font-size:3.2rem;display:block;margin-bottom:10px}
.login-hero-zone h1{font-size:1.85rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.login-hero-zone p{opacity:.7;font-size:.85rem}
.login-scroll-area{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:0 14px 20px;
}
.login-scroll-area::-webkit-scrollbar{display:none}
.login-grid-inner{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  max-width:500px;
  margin:0 auto 16px;
}
@media(min-width:380px){.login-grid-inner{grid-template-columns:repeat(4,1fr)}}
@media(min-width:520px){.login-grid-inner{grid-template-columns:repeat(5,1fr)}}
.admin-panel-inner{
  background:rgba(0,0,0,.22);
  border-radius:var(--r);
  padding:18px;
  max-width:340px;
  margin:0 auto;
  backdrop-filter:blur(10px);
}
.admin-panel-inner label{color:rgba(255,255,255,.75);display:block;font-size:.8rem;font-weight:600;margin-bottom:5px}
.admin-panel-inner input{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;width:100%;padding:11px 14px;border:1.5px solid;border-radius:var(--r-sm);font-family:inherit;font-size:.9rem;outline:none}
.admin-panel-inner input::placeholder{color:rgba(255,255,255,.3)}
.admin-panel-inner input:focus{border-color:var(--gold);background:rgba(255,255,255,.15);box-shadow:none}
.admin-panel-inner .btn{background:var(--gold);color:#1a1a1a;margin-top:10px}
.li-err{color:#fca5a5;font-size:.78rem;margin-top:6px;display:none}
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.loading-card{background:#fff;border-radius:var(--r);padding:24px 32px;text-align:center;font-weight:600;color:var(--t);display:flex;align-items:center;gap:10px}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="loading" class="loading-overlay">
  <div class="loading-card"><span class="spin" style="border-top-color:var(--g);border-color:rgba(0,0,0,.1)"></span> Chargement…</div>
</div>

<div class="login-page" id="login-page" style="display:none">
  <div class="login-hero-zone">
    <span class="trophy">🏆</span>
    <h1>CDM 2026</h1>
    <p>Pronostics · Sélectionnez votre nom</p>
  </div>

  <div class="login-scroll-area">
    <div class="login-grid-inner" id="login-grid"></div>

    <div id="admin-panel" class="admin-panel-inner" style="display:none">
      <div style="margin-bottom:12px">
        <label>Mot de passe administrateur</label>
        <input type="password" id="li-pwd" placeholder="Mot de passe…"
          onkeydown="if(event.key==='Enter')doAdminLogin()">
        <p id="li-err" class="li-err"></p>
      </div>
      <button class="btn btn-full" onclick="doAdminLogin()">
        <i class="ti ti-shield-check"></i> Connexion admin
      </button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
(async function(){
  if(!requireConfig()){return}

  try{
    st = await sbReadAll();
  }catch(e){
    document.getElementById('loading').innerHTML=
      '<div class="loading-card" style="flex-direction:column;gap:8px">'+
      '<i class="ti ti-wifi-off" style="font-size:2rem;color:#ef4444"></i>'+
      '<span>Erreur de connexion</span>'+
      '<a href="index.html" style="font-size:.82rem;color:var(--g)">Retour</a>'+
      '</div>';
    return;
  }

  document.getElementById('loading').style.display='none';
  document.getElementById('login-page').style.display='flex';
  renderGrid();
})();

function renderGrid(){
  const parts = getParts();
  const colorMap = {};
  parts.forEach((p,i)=>{colorMap[p.id]=COLORS[i%COLORS.length];});

  const cards = parts.map(p=>{
    const c = colorMap[p.id];
    const ini = getInitials(p.name);
    return `<div class="pcard" onclick="selectUser('${p.id}')">
      <div class="pavatar" style="background:${c}">${esc(ini)}</div>
      <div class="pname">${esc(p.name)}</div>
    </div>`;
  }).join('');

  const adminCard = `<div class="pcard padmin" onclick="showAdminPanel()">
    <div class="pavatar" style="background:var(--gold)"><i class="ti ti-shield-check" style="font-size:1.1rem"></i></div>
    <div class="pname">Admin</div>
  </div>`;

  document.getElementById('login-grid').innerHTML = cards + adminCard;
}

function selectUser(pid){
  const p = getParts().find(x=>x.id===pid);
  if(!p)return;
  setUser(p, false);
  window.location.href='classement.html';
}

function showAdminPanel(){
  const panel = document.getElementById('admin-panel');
  const visible = panel.style.display==='block';
  panel.style.display = visible ? 'none' : 'block';
  if(!visible) setTimeout(()=>document.getElementById('li-pwd').focus(),60);
}

function doAdminLogin(){
  const errEl = document.getElementById('li-err');
  errEl.style.display='none';
  const pwd = document.getElementById('li-pwd').value;
  if(pwd===st.settings?.adminPwd){
    setUser({id:'admin',name:'Admin'}, true);
    window.location.href='classement.html';
  }else{
    errEl.textContent='Mot de passe incorrect.';
    errEl.style.display='block';
    document.getElementById('li-pwd').select();
  }
}
</script>
</body>
</html>
