<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CDM 2026 · Connexion</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.login-page{
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,#052e16 0%,#14532d 50%,#0a3320 100%);
}
/* Points lumineux décoratifs */
.login-page::before{
  content:'';position:absolute;top:0;left:0;right:0;height:50%;
  background:radial-gradient(ellipse at 50% -20%,rgba(22,163,74,.35) 0%,transparent 65%);
  pointer-events:none;z-index:0;
}
.login-hero-zone{
  flex-shrink:0;padding:28px 20px 14px;text-align:center;color:#fff;position:relative;z-index:1;
}
.login-hero-zone .trophy{
  font-size:3.2rem;display:block;margin-bottom:8px;
  animation:float 3s ease-in-out infinite;
  filter:drop-shadow(0 8px 28px rgba(34,197,94,.45));
}
.login-hero-zone h1{font-size:1.8rem;font-weight:900;letter-spacing:-.04em;margin-bottom:3px;text-shadow:0 2px 16px rgba(0,0,0,.4)}
.login-hero-zone .sub{font-size:.75rem;font-weight:500;opacity:.6;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
.login-hero-zone .who{
  display:inline-block;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);
  border-radius:var(--r-pill);padding:5px 16px;font-size:.84rem;font-weight:700;
  letter-spacing:.01em;backdrop-filter:blur(8px);
}
/* Écran court : hero ultra-compact */
@media(max-height:700px){
  .login-hero-zone{padding:16px 20px 10px}
  .login-hero-zone .trophy{font-size:2.4rem;margin-bottom:5px;animation:none}
  .login-hero-zone h1{font-size:1.5rem}
  .login-hero-zone .sub{display:none}
  .login-hero-zone .who{padding:4px 14px;font-size:.8rem}
}
@media(max-height:580px){
  .login-hero-zone{padding:10px 20px 8px}
  .login-hero-zone .trophy{font-size:1.8rem;margin-bottom:4px}
  .login-hero-zone h1{font-size:1.3rem}
  .login-hero-zone .who{display:none}
}
.login-scroll-area{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:6px 14px;
  padding-bottom:max(24px, calc(env(safe-area-inset-bottom) + 24px));
  position:relative;z-index:1;
}
.login-scroll-area::-webkit-scrollbar{display:none}
.login-grid-inner{
  display:grid;grid-template-columns:repeat(2,1fr);gap:11px;
  max-width:520px;margin:0 auto 16px;
}
@media(min-width:440px){.login-grid-inner{grid-template-columns:repeat(3,1fr)}}
@media(min-width:600px){.login-grid-inner{grid-template-columns:repeat(4,1fr)}}
.admin-panel-inner{
  background:rgba(0,0,0,.3);border-radius:var(--r);padding:20px;
  max-width:340px;margin:0 auto;
  border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px);
}
.admin-panel-inner label{color:rgba(255,255,255,.8);display:block;font-size:.72rem;font-weight:800;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.admin-panel-inner input{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);color:#fff;width:100%;padding:12px 14px;border-radius:var(--r-sm);font-family:inherit;font-size:.95rem;outline:none}
.admin-panel-inner input::placeholder{color:rgba(255,255,255,.3)}
.admin-panel-inner input:focus{border-color:#fbbf24;background:rgba(255,255,255,.16);box-shadow:0 0 0 4px rgba(251,191,36,.2);outline:none}
.admin-panel-inner .btn{background:linear-gradient(135deg,#d97706,#b45309);color:#fff;box-shadow:0 4px 16px rgba(217,119,6,.35);margin-top:10px}
.li-err{color:#fca5a5;font-size:.78rem;margin-top:6px;display:none;font-weight:600}
.loading-overlay{position:fixed;inset:0;background:rgba(5,46,22,.7);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(8px)}
.loading-card{background:#fff;border-radius:var(--r);padding:24px 32px;text-align:center;font-weight:700;color:var(--t);display:flex;align-items:center;gap:10px;box-shadow:var(--sh-xl)}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="loading" class="loading-overlay">
  <div class="loading-card"><span class="spin" style="border-top-color:var(--g);border-color:rgba(0,0,0,.1)"></span> Chargement…</div>
</div>

<div class="login-page" id="login-page" style="display:none">
  <div class="login-hero-zone">
    <span class="trophy">🏆</span>
    <h1>CDM 2026</h1>
    <div class="sub">Coupe du Monde · Pronostics</div>
    <div class="who">Qui êtes-vous ?</div>
  </div>

  <div class="login-scroll-area">
    <div class="login-grid-inner" id="login-grid"></div>

    <div id="admin-panel" class="admin-panel-inner" style="display:none">
      <div style="margin-bottom:12px">
        <label>Mot de passe administrateur</label>
        <input type="password" id="li-pwd" placeholder="Mot de passe…"
          onkeydown="if(event.key==='Enter')doAdminLogin()">
        <p id="li-err" class="li-err"></p>
      </div>
      <button class="btn btn-full" onclick="doAdminLogin()">
        <i class="ti ti-shield-check"></i> Connexion admin
      </button>
    </div>
  </div>
</div>

<script src="app.js?v=8"></script>
<script>
(async function(){
  if(!requireConfig()){return}

  try{
    st = await sbReadAll();
  }catch(e){
    document.getElementById('loading').innerHTML=
      '<div class="loading-card" style="flex-direction:column;gap:8px">'+
      '<i class="ti ti-wifi-off" style="font-size:2rem;color:#ef4444"></i>'+
      '<span>Erreur de connexion</span>'+
      '<a href="index.html" style="font-size:.82rem;color:var(--g)">Retour</a>'+
      '</div>';
    return;
  }

  document.getElementById('loading').style.display='none';
  document.getElementById('login-page').style.display='flex';
  renderGrid();
})();

function renderGrid(){
  const parts = getParts();
  const colorMap = {};
  parts.forEach((p,i)=>{colorMap[p.id]=COLORS[i%COLORS.length];});

  const cards = parts.map(p=>{
    const c = colorMap[p.id];
    const ini = getInitials(p.name);
    return `<div class="pcard" onclick="selectUser('${p.id}')">
      <div class="pavatar" style="background:${c}">${esc(ini)}</div>
      <div class="pname">${esc(p.name)}</div>
    </div>`;
  }).join('');

  const adminCard = `<div class="pcard padmin" onclick="showAdminPanel()">
    <div class="pavatar" style="background:var(--gold)"><i class="ti ti-shield-check" style="font-size:1.1rem"></i></div>
    <div class="pname">Admin</div>
  </div>`;

  document.getElementById('login-grid').innerHTML = cards + adminCard;
}

function selectUser(pid){
  const p = getParts().find(x=>x.id===pid);
  if(!p)return;
  setUser(p, false);
  window.location.href='classement.html';
}

function showAdminPanel(){
  const panel = document.getElementById('admin-panel');
  const visible = panel.style.display==='block';
  panel.style.display = visible ? 'none' : 'block';
  if(!visible) setTimeout(()=>document.getElementById('li-pwd').focus(),60);
}

function doAdminLogin(){
  const errEl = document.getElementById('li-err');
  errEl.style.display='none';
  const pwd = document.getElementById('li-pwd').value;
  if(pwd===st.settings?.adminPwd){
    setUser({id:'admin',name:'Admin'}, true);
    window.location.href='admin.html';
  }else{
    errEl.textContent='Mot de passe incorrect.';
    errEl.style.display='block';
    document.getElementById('li-pwd').select();
  }
}
</script>
</body>
</html>
