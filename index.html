<html lang="fr">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--green:#1B5E35;--green-l:#2D7A4F;--green-d:#0F3D22;--white:#FFFFFF;--gold:#D4AC0D;--gold-l:#F0C930;--bg:#F4F8F4;--border:#D6E4D8;--text:#1a1a1a;--muted:#6b7280;--r:12px;--sh:0 2px 8px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--green);min-height:100vh;color:var(--text)}
.center{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.auth-card{background:#fff;border-radius:var(--r);padding:36px;width:100%;max-width:440px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.auth-card h1{font-size:1.4rem;font-weight:700;color:var(--green);margin-bottom:4px}
.auth-card .sub{color:var(--muted);font-size:.85rem;margin-bottom:20px}
.logo{text-align:center;margin-bottom:20px;font-size:3rem}
.fg{margin-bottom:14px}
label{display:block;font-size:.85rem;font-weight:500;margin-bottom:5px}
input[type=text],input[type=password],input[type=number],select{width:100%;padding:9px 13px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.9rem;color:var(--text);background:#fff;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--green)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-family:inherit;font-size:.875rem;font-weight:500;cursor:pointer;border:none;transition:all .15s;text-decoration:none}
.btn-primary{background:var(--green);color:#fff;width:100%;justify-content:center}
.btn-primary:hover{background:var(--green-l)}
.btn-sm{padding:5px 11px;font-size:.78rem}
.btn-outline{background:transparent;border:1.5px solid rgba(255,255,255,.4);color:#fff}
.btn-outline:hover{background:rgba(255,255,255,.1)}
.btn-danger{background:#dc2626;color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--bg)}
.err{color:#dc2626;font-size:.8rem;margin-top:6px;display:none}
/* App */
#app{min-height:100vh;display:flex;flex-direction:column}
.hdr{background:var(--green-d);color:#fff;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:8px}
.hdr-title{font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:6px}
.hdr-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:.7rem;font-weight:600;white-space:nowrap}
.b-green{background:rgba(255,255,255,.15);color:#fff}
.b-gold{background:var(--gold);color:#fff}
.b-live{background:#22c55e;color:#fff;animation:pulse 2s infinite}
.b-admin{background:var(--gold);color:#fff}
.b-red{background:#dc2626;color:#fff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.nav{background:var(--green-d);padding:0 8px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid rgba(255,255,255,.1)}
.nav::-webkit-scrollbar{display:none}
.ntab{display:flex;align-items:center;gap:5px;padding:9px 12px;color:rgba(255,255,255,.6);font-size:.78rem;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.ntab:hover{color:#fff}
.ntab.active{color:var(--gold);border-bottom-color:var(--gold)}
.content{flex:1;padding:16px;max-width:1200px;margin:0 auto;width:100%}
.card{background:#fff;border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--border)}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.card-title{font-size:.95rem;font-weight:600;color:var(--green);display:flex;align-items:center;gap:7px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;padding:7px 9px;background:var(--bg);color:var(--muted);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border)}
td{padding:9px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}
.rnk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:.78rem;font-weight:700}
.r1{background:var(--gold);color:#fff}
.r2{background:#9ca3af;color:#fff}
.r3{background:#b45309;color:#fff}
.rx{background:var(--bg);color:var(--muted)}
.si{display:flex;align-items:center;gap:7px}
.si input{width:48px;text-align:center;padding:6px 4px}
.sep{font-weight:700;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:10px;padding:11px;border:1.5px solid var(--border);border-radius:9px;margin-bottom:8px;background:#fff;flex-wrap:wrap}
.mrow.locked{opacity:.75;background:var(--bg)}
.mteams{flex:1;min-width:140px}
.mteams .name{font-weight:500;font-size:.9rem}
.mmeta{font-size:.72rem;color:var(--muted);margin-top:2px}
.mscore{font-size:1.1rem;font-weight:700;color:var(--green)}
.p3{color:#16a34a;font-weight:700}
.p2{color:#2563eb;font-weight:600}
.p1{color:#d97706;font-weight:600}
.p0{color:#dc2626}
.ph{background:var(--green);color:#fff;padding:7px 14px;border-radius:7px;margin:16px 0 9px;font-weight:600;font-size:.85rem;display:flex;align-items:center;gap:7px}
.bk{background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:10px 13px;margin-bottom:7px}
.bk .bk-teams{display:flex;justify-content:space-between;align-items:center;font-size:.875rem}
.bk .bk-score{font-weight:700;color:var(--green);font-size:1rem;margin:0 10px}
.bk .bk-meta{font-size:.7rem;color:var(--muted);margin-top:3px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.sec-title{font-size:1rem;font-weight:700;color:var(--green);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.empty{text-align:center;padding:36px;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;right:20px;background:#1a1a1a;color:#fff;padding:11px 18px;border-radius:8px;font-size:.85rem;z-index:9999;display:none;box-shadow:0 4px 12px rgba(0,0,0,.25);max-width:300px}
.toast.ok{background:#16a34a}
.toast.err2{background:#dc2626}
.me td{background:#f0fdf4;font-weight:600}
.bonus-box{background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:14px;margin-bottom:10px}
hr.div{border:none;border-top:1px solid var(--border);margin:14px 0}
tr.qual td{background:#f0fdf4}
.link{color:var(--green);cursor:pointer;font-size:.82rem;text-decoration:underline;margin-top:10px;display:inline-block}
@media(max-width:640px){.auth-card{padding:22px}.content{padding:10px}.card{padding:13px}.gg{grid-template-columns:1fr}}
</style>
</head>

// ── UTILS ──────────────────────────────────────────────
function today(){const d=new Date();return d.getFullYear()+'-'+S2(d.getMonth()+1)+'-'+S2(d.getDate())}
function S2(n){return String(n).padStart(2,'0')}
function genId(){return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function toast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast'+(type?' '+type:'');
  t.style.display='block'; clearTimeout(t._t);
  t._t=setTimeout(()=>{t.style.display='none'},3000);
}
function shErr(id,msg){const e=document.getElementById(id);if(e){e.textContent=msg;e.style.display='block'}}
function hiErr(id){const e=document.getElementById(id);if(e)e.style.display='none'}

// ── FIREBASE ───────────────────────────────────────────
async function fbRead(){const r=await fetch(DB+'.json');return r.ok?r.json():null}
async function fbWrite(data){const r=await fetch(DB+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});return r.ok}
async function apiPatch(path,obj){const r=await fetch(`${DB}/${path}.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});return r.ok}
async function apiPut(path,val){const r=await fetch(`${DB}/${path}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(val)});return r.ok}

async function fbInit(rootUrl,adminPwd){
  const base=rootUrl.replace(/\/$/,'');
  DB=base+'/cdm2026';
  const po={},mo={};
  SP.forEach(p=>po[p.id]=p);
  SM.forEach(m=>mo[m.id]=m);
  const data={participants:po,matches:mo,pronostics:{},bonus:{},bonusQuestions:SBQ,bonusResults:{},settings:{adminPwd,lastModified:Date.now()}};
  const ok=await fbWrite(data);
  if(ok){window.location.hash=btoa(JSON.stringify({dbUrl:DB}));st=data;return true}
  return false;
}

// ── SSE ────────────────────────────────────────────────
function setupSSE(){
  if(sseSrc){try{sseSrc.close()}catch{}sseSrc=null}
  sseSrc=new EventSource(`${DB}.json`);
  sseSrc.addEventListener('put',e=>{
    try{const {data}=JSON.parse(e.data);if(data)applyState(data)}catch{}
  });
  sseSrc.onerror=()=>{
    sseSrc.close();sseSrc=null;sseR++;
    setBadge(false);
    setTimeout(setupSSE,Math.min(3000*sseR,30000));
  };
  sseSrc.onopen=()=>{sseR=0;setBadge(true)};
}

function setBadge(ok){
  const b=document.getElementById('sse-badge');if(!b)return;
  if(ok){b.innerHTML='<i class="ti ti-wifi"></i> Temps réel';b.className='badge b-live'}
  else{b.innerHTML='<span class="spin"></span> Reconnexion…';b.className='badge b-green'}
}

function applyState(data){
  if(data.participants)st.participants=data.participants;
  if(data.matches)st.matches=data.matches;
  if(data.pronostics!==undefined)st.pronostics=data.pronostics||{};
  if(data.bonus!==undefined)st.bonus=data.bonus||{};
  if(data.bonusQuestions)st.bonusQuestions=data.bonusQuestions;
  if(data.bonusResults!==undefined)st.bonusResults=data.bonusResults||{};
  if(data.settings)st.settings=data.settings;
  renderTab();
}

// ── POINTS ─────────────────────────────────────────────
function calcPts(p,m){
  if(m.homeScore==null||m.awayScore==null)return null;
  if(!p||p.homeScore==null||p.awayScore==null)return 0;
  const ph=+p.homeScore,pa=+p.awayScore,mh=+m.homeScore,ma=+m.awayScore;
  if(ph===mh&&pa===ma)return 3;
  const pw=ph>pa?'h':pa>ph?'a':'d', rw=mh>ma?'h':ma>mh?'a':'d';
  if(pw===rw){
    if(pw==='d')return 1;
    if((ph-pa)===(mh-ma))return 2;
    return 1;
  }
  return 0;
}

function calcTotal(pid){
  let t=0;
  const pr=getProns(),br=getBR(),bq=getBQ(),bd=getBonus();
  getMatches().forEach(m=>{
    if(m.homeScore==null)return;
    const pts=calcPts(pr[pid+'_'+m.id],m);
    if(pts)t+=pts;
  });
  const ub=bd[pid]||{};
  bq.forEach(q=>{
    const r=br[q.id];
    if(r&&ub[q.id]&&ub[q.id].trim().toLowerCase()===r.trim().toLowerCase())t+=5;
  });
  return t;
}

// ── LOCK ───────────────────────────────────────────────
function isEditable(m){
  if(m.homeScore!=null)return false;
  if(!m.date)return true;
  const [y,mo,d]=m.date.split('-').map(Number);
  const lk=new Date(y,mo-1,d-1);
  const ls=lk.getFullYear()+'-'+S2(lk.getMonth()+1)+'-'+S2(lk.getDate());
  return today()<ls;
}
function isBonusEditable(){
  const fd=getMatches().filter(m=>m.date).sort((a,b)=>a.date.localeCompare(b.date))[0]?.date;
  return !fd||today()<fd;
}

async function doLogin(){
  hiErr('li-err');
  const name=document.getElementById('li-name').value.trim();
  if(!name){shErr('li-err','Veuillez saisir votre prénom.');return}

  if(name.toLowerCase()==='admin'){
    const pwd=document.getElementById('li-pwd').value;
    if(pwd===getSettings().adminPwd){
      user={id:'admin',name:'Admin'};admin=true;enterApp();
    }else{shErr('li-err','Mot de passe admin incorrect.')}
    return;
  }
  const ex=getParts().find(p=>p.name.toLowerCase()===name.toLowerCase());
  if(ex){user=ex;admin=false;enterApp();return}
  const id=genId();
  await apiPatch('participants/'+id,{id,name});
  if(!st.participants)st.participants={};
  st.participants[id]={id,name};
  user={id,name};admin=false;enterApp();
}

// ── CLASSEMENT ─────────────────────────────────────────
function rClassement(){
  const parts=getParts();
  const ranked=parts.map(p=>({...p,pts:calcTotal(p.id),
    played:getMatches().filter(m=>m.homeScore!=null&&getProns()[p.id+'_'+m.id]&&getProns()[p.id+'_'+m.id].homeScore!=null).length
  })).sort((a,b)=>b.pts-a.pts||(a.name.localeCompare(b.name)));

  const rows=ranked.map((p,i)=>{
    const r=i+1,me=user&&p.id===user.id;
    const rb=r===1?`<span class="rnk r1">🥇</span>`:r===2?`<span class="rnk r2">🥈</span>`:r===3?`<span class="rnk r3">🥉</span>`:`<span class="rnk rx">${r}</span>`;
    return `<tr class="${me?'me':''}">
      <td>${rb}</td>
      <td>${esc(p.name)}${me?' <span class="badge b-live" style="font-size:.62rem">Vous</span>':''}</td>
      <td><strong style="color:var(--green);font-size:1.05rem">${p.pts}</strong></td>
      <td style="color:var(--muted)">${p.played}</td>
    </tr>`;
  }).join('');

  return `<div class="card">
    <div class="card-hdr"><div class="card-title"><i class="ti ti-trophy"></i> Classement général</div>
    <span style="color:var(--muted);font-size:.8rem">${ranked.length} participants</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>#</th><th>Participant</th><th>Points</th><th>Matchs</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>`;
}

// ── MES PRONOSTICS ─────────────────────────────────────
function rMesProns(){
  if(!user)return'';
  const matches=getMatches(), prons=getProns();
  const order=['Groupe A','Groupe B','Groupe C','Groupe D','Groupe E','Groupe F',
    'Groupe G','Groupe H','Groupe I','Groupe J','Groupe K','Groupe L',
    '16e de finale','Huitième de finale','Quart de finale','Demi-finale','3e place','Finale'];
  const grouped={};
  matches.forEach(m=>{if(!grouped[m.phase])grouped[m.phase]=[];grouped[m.phase].push(m)});

  let html=`<div class="card" style="margin-bottom:12px">
    <div class="card-hdr"><div class="card-title"><i class="ti ti-pencil"></i> Mes pronostics</div>
    <small style="color:var(--muted)">Verrouillé 1 jour avant chaque match</small></div>
    <p style="font-size:.8rem;color:var(--muted)">Les scores sont sauvegardés automatiquement dès que vous renseignez les deux équipes.</p>
  </div>`;

  (order.filter(ph=>grouped[ph])||[]).forEach(phase=>{
    html+=`<div class="ph"><i class="ti ti-circle-filled" style="font-size:.45rem"></i>${esc(phase)}</div>`;
    grouped[phase].forEach(m=>{
      const key=user.id+'_'+m.id, p=prons[key]||{}, ed=isEditable(m), has=m.homeScore!=null;
      const pts=has?calcPts(p,m):null;
      const ptsCls=pts===3?'p3':pts===2?'p2':pts===1?'p1':'p0';
      const ptsHtml=pts!==null?`<span class="${ptsCls}" style="font-size:.8rem">${pts}pt${pts>1?'s':''}</span>`:'';
      const realHtml=has?`<span style="font-size:.7rem;color:var(--muted)">(${m.homeScore}-${m.awayScore})</span>`:'';

      if(ed){
        html+=`<div class="mrow">
          <div class="mteams">
            <div class="name">${esc(m.home)} <span style="color:var(--muted)">vs</span> ${esc(m.away)}</div>
            <div class="mmeta">${m.date} ${m.time} · ${esc(m.venue)}</div>
          </div>
          <div class="si">
            <input type="number" min="0" max="20" value="${p.homeScore??''}" placeholder="?"
              onchange="savePron('${user.id}','${m.id}','home',this.value)" style="width:48px">
            <span class="sep">–</span>
            <input type="number" min="0" max="20" value="${p.awayScore??''}" placeholder="?"
              onchange="savePron('${user.id}','${m.id}','away',this.value)" style="width:48px">
          </div>
          ${ptsHtml}
        </div>`;
      }else{
        const mysc=p.homeScore!=null?`<strong>${p.homeScore}–${p.awayScore}</strong>`:`<em style="color:var(--muted)">–</em>`;
        html+=`<div class="mrow locked">
          <div class="mteams">
            <div class="name">${esc(m.home)} vs ${esc(m.away)}</div>
            <div class="mmeta">${m.date} ${m.time} · ${esc(m.venue)}</div>
          </div>
          <div style="text-align:right;display:flex;align-items:center;gap:8px">
            <span class="mscore">${mysc}</span>${realHtml}${ptsHtml}
          </div>
          <i class="ti ti-lock" style="color:var(--muted);font-size:.9rem"></i>
        </div>`;
      }
    });
  });
  return html;
}

async function savePron(pid,mid,side,val){
  const key=pid+'_'+mid;
  if(!st.pronostics)st.pronostics={};
  const cur=st.pronostics[key]||{};
  const upd={...cur,participantId:pid,matchId:mid};
  upd[side+'Score']=val===''?null:+val;
  st.pronostics[key]=upd;

      <thead><tr><th>Match</th><th>Réel</th>${parts.map(p=>`<th style="white-space:nowrap">${esc(p.name)}</th>`).join('')}</tr></thead>
      <tbody>`;

  played.forEach(m=>{

    html+=`<tr>
      <td><div style="font-weight:500;font-size:.82rem">${esc(m.home)} vs ${esc(m.away)}</div>
          <div style="color:var(--muted);font-size:.7rem">${m.date} · ${esc(m.phase)}</div></td>
      <td>${has?`<strong>${m.homeScore}–${m.awayScore}</strong>`:'<span style="color:var(--muted)">–</span>'}</td>`;
    parts.forEach(p=>{

      if(!pr||pr.homeScore==null){html+=`<td style="color:var(--muted)">–</td>`;return}
      if(has){const pts=calcPts(pr,m);const cl=pts===3?'p3':pts===2?'p2':pts===1?'p1':'p0';
        html+=`<td><span class="${cl}">${pr.homeScore}–${pr.awayScore}</span></td>`}
      else{html+=`<td>${pr.homeScore}–${pr.awayScore}</td>`}
    });
    html+='</tr>';
  });
  html+=`</tbody></table></div></div>`;
  return html;

// ── RÉSULTATS ──────────────────────────────────────────
function calcGroupStandings(){
  const groups={};
  getMatches().filter(m=>/^Groupe [A-L]$/.test(m.phase)).forEach(m=>{
    if(!groups[m.phase])groups[m.phase]={};
    [m.home,m.away].forEach(t=>{if(!groups[m.phase][t])groups[m.phase][t]={name:t,mj:0,g:0,n:0,p:0,bp:0,bc:0,pts:0}});
    if(m.homeScore!=null&&m.awayScore!=null){
      const h=+m.homeScore,a=+m.awayScore,ht=groups[m.phase][m.home],at=groups[m.phase][m.away];
      ht.mj++;ht.bp+=h;ht.bc+=a;at.mj++;at.bp+=a;at.bc+=h;
      if(h>a){ht.g++;ht.pts+=3;at.p++}else if(h<a){at.g++;at.pts+=3;ht.p++}else{ht.n++;ht.pts++;at.n++;at.pts++}
    }
  });
  Object.keys(groups).forEach(g=>{
    groups[g]=Object.values(groups[g]).sort((a,b)=>b.pts-a.pts||(b.bp-b.bc)-(a.bp-a.bc)||b.bp-a.bp);
  });
  return groups;
}

function rResultats(){
  const groups=calcGroupStandings();
  const gnames=Object.keys(groups).sort();
  let html=`<h2 class="sec-title"><i class="ti ti-list-details"></i> Classements de groupe</h2><div class="gg">`;

  gnames.forEach(g=>{
    const teams=groups[g];
    html+=`<div class="card" style="margin-bottom:0">
      <div class="card-title" style="margin-bottom:10px">${esc(g)}</div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>#</th><th>Équipe</th><th>MJ</th><th>G</th><th>N</th><th>P</th><th>BP</th><th>BC</th><th>DB</th><th>Pts</th></tr></thead>
        <tbody>`;
    teams.forEach((t,i)=>html+=`<tr class="${i<2?'qual':''}">
      <td>${i+1}</td><td style="font-weight:${i<2?600:400}">${esc(t.name)}</td>
      <td>${t.mj}</td><td>${t.g}</td><td>${t.n}</td><td>${t.p}</td>
      <td>${t.bp}</td><td>${t.bc}</td><td>${t.bp-t.bc}</td><td><strong>${t.pts}</strong></td>
    </tr>`);
    html+=`</tbody></table></div></div>`;
  });
  html+='</div>';

  const fphases=['16e de finale','Huitième de finale','Quart de finale','Demi-finale','3e place','Finale'];
  html+=`<h2 class="sec-title" style="margin-top:22px"><i class="ti ti-tournament"></i> Phases finales</h2>`;
  fphases.forEach(ph=>{
    const ms=getMatches().filter(m=>m.phase===ph);
    if(!ms.length)return;
    html+=`<div class="ph">${esc(ph)}</div>`;
    ms.forEach(m=>{
      const hs=m.homeScore!=null;
      html+=`<div class="bk">
        <div class="bk-teams">
          <span style="font-weight:500">${esc(m.home)}</span>
          <span class="bk-score">${hs?m.homeScore+' – '+m.awayScore:'vs'}</span>
          <span style="font-weight:500">${esc(m.away)}</span>
        </div>
        <div class="bk-meta">${m.date} ${m.time} · ${esc(m.venue)}</div>
      </div>`;
    });
  });
  return html;
}

// ── DASHBOARD ADMIN ────────────────────────────────────
function rDashboard(){
  if(!admin)return'<div class="card"><p>Accès réservé à l\'administrateur.</p></div>';
  const matches=getMatches();
  const order=['Groupe A','Groupe B','Groupe C','Groupe D','Groupe E','Groupe F',
    'Groupe G','Groupe H','Groupe I','Groupe J','Groupe K','Groupe L',
    '16e de finale','Huitième de finale','Quart de finale','Demi-finale','3e place','Finale'];
  const grouped={};
  matches.forEach(m=>{if(!grouped[m.phase])grouped[m.phase]=[];grouped[m.phase].push(m)});

  let html=`<div class="card"><div class="card-title"><i class="ti ti-settings-2"></i> Saisie des scores réels</div>
    <p style="color:var(--muted);font-size:.82rem;margin-top:6px">Saisissez les scores puis cliquez sur <i class="ti ti-check"></i>.</p></div>`;

  order.filter(ph=>grouped[ph]).forEach(phase=>{
    html+=`<div class="ph">${esc(phase)}</div>`;
    grouped[phase].forEach(m=>{
      html+=`<div class="mrow" style="gap:8px">
        <div class="mteams">
          <div class="name">${esc(m.home)} vs ${esc(m.away)}</div>
          <div class="mmeta">${m.date} ${m.time} · ${esc(m.venue)}</div>
        </div>
        <div class="si">
          <input type="number" min="0" max="20" value="${m.homeScore??''}" placeholder="?" id="ah-${m.id}" style="width:46px">
          <span class="sep">–</span>
          <input type="number" min="0" max="20" value="${m.awayScore??''}" placeholder="?" id="aa-${m.id}" style="width:46px">
        </div>
        <button class="btn btn-primary btn-sm" onclick="adminSave('${m.id}')"><i class="ti ti-check"></i></button>
        ${m.homeScore!=null?`<button class="btn btn-danger btn-sm" onclick="adminClear('${m.id}')" title="Effacer"><i class="ti ti-x"></i></button>`:''}

async function adminSave(mid){
  const h=document.getElementById('ah-'+mid)?.value;
  const a=document.getElementById('aa-'+mid)?.value;
  if(h===''||a===''){toast('Saisissez les deux scores','err2');return}
  const ok=await apiPatch('matches/'+mid,{homeScore:+h,awayScore:+a});
  if(ok){
    if(!st.matches)st.matches={};
    if(!st.matches[mid])st.matches[mid]={};
    st.matches[mid].homeScore=+h;st.matches[mid].awayScore=+a;
    toast('Score sauvegardé ✓','ok');
  }else toast('Erreur Firebase','err2');
}

async function adminClear(mid){
  if(!confirm('Effacer ce score ?'))return;
  const ok=await apiPatch('matches/'+mid,{homeScore:null,awayScore:null});
  if(ok){
    if(st.matches&&st.matches[mid]){st.matches[mid].homeScore=null;st.matches[mid].awayScore=null}
    toast('Score effacé','ok');renderTab();
  }else toast('Erreur','err2');
}

// ── BONUS RESULTS ──────────────────────────────────────
function rBonusResults(){
  const bq=getBQ(), bd=getBonus(), br=getBR();
  const parts=getParts().sort((a,b)=>a.name.localeCompare(b.name));
  let html=`<div class="card">
    <div class="card-title"><i class="ti ti-star-filled"></i> Résultats bonus</div>`;

  if(admin){
    html+=`<p style="color:var(--muted);font-size:.82rem;margin:8px 0 14px">Saisissez les réponses correctes pour attribuer les points bonus.</p>`;
    bq.forEach(q=>{
      html+=`<div class="bonus-box">
        <label style="font-weight:600">${esc(q.label)}</label>
        <div style="display:flex;gap:8px;margin-top:7px">
          <input type="text" id="br-${q.id}" value="${esc(br[q.id]||'')}" placeholder="Réponse correcte…" style="flex:1">
          <button class="btn btn-primary btn-sm" onclick="saveBR('${q.id}')"><i class="ti ti-check"></i> Valider</button>
        </div>
      </div>`;
    });
    html+='<hr class="div">';
  }

  html+=`<h3 style="font-size:.875rem;font-weight:600;margin-bottom:10px;color:var(--muted)">Réponses des participants</h3>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Participant</th>${bq.map(q=>`<th>${esc(q.label)}</th>`).join('')}<th>Pts bonus</th></tr></thead>
      <tbody>`;

  parts.forEach(p=>{
    const ub=bd[p.id]||{};
    let bpts=0;
    const cells=bq.map(q=>{
      const ans=ub[q.id]||'';
      const r=br[q.id];
      let st2='color:var(--muted)';
      if(r&&ans){
        const match=ans.trim().toLowerCase()===r.trim().toLowerCase();
        if(match){st2='color:#16a34a;font-weight:600';bpts+=5}else st2='color:#dc2626';
      }
      return`<td style="${st2}">${esc(ans)||'–'}</td>`;
    }).join('');
    html+=`<tr><td>${esc(p.name)}</td>${cells}<td><strong>${bpts}</strong></td></tr>`;
  });
  html+=`</tbody></table></div></div>`;
  return html;
}

async function saveBR(qid){
  const val=document.getElementById('br-'+qid)?.value.trim()||'';
  if(!st.bonusResults)st.bonusResults={};
  st.bonusResults[qid]=val;
  const ok=await apiPut('bonusResults/'+qid,val);
  if(ok)toast('Résultat bonus sauvegardé ✓','ok');
  else toast('Erreur Firebase','err2');
}

// ── INIT ───────────────────────────────────────────────
async function init(){
  const hash=window.location.hash.slice(1);
  if(!hash){document.getElementById('s-setup').hidden=false;return}
  try{
    const cfg=JSON.parse(atob(hash));
    DB=cfg.dbUrl;
  }catch{document.getElementById('s-setup').hidden=false;return}
  try{
    const data=await fbRead();
    if(!data||!data.participants)throw new Error('empty');
    st=data;
    document.getElementById('s-login').hidden=false;
  }catch{
    document.getElementById('s-setup').hidden=false;
  }
}

// Hide all screens initially
document.getElementById('s-setup').hidden=true;
document.getElementById('s-login').hidden=true;
init();
</script>
