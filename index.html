<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CDM 2026 · Pronostics</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="invalid-screen" class="full-center" style="display:none">
  <div class="auth-box" style="text-align:center">
    <div style="font-size:3rem;margin-bottom:12px">🔗</div>
    <h2 style="margin-bottom:8px">Lien invalide</h2>
    <p style="color:var(--t2);line-height:1.65">Ce lien n'est pas valide.<br>Demandez le lien à l'administrateur.</p>
    <div style="margin-top:16px">
      <a href="index.html?setup" style="font-size:.82rem;color:var(--g);text-decoration:none;font-weight:600">
        <i class="ti ti-settings"></i> Configuration admin
      </a>
    </div>
  </div>
</div>

<script>
(function(){
  var hash = window.location.hash.slice(1);
  var search = window.location.search;
  var isSetup = search.indexOf('setup') !== -1;

  // Si paramètre ?setup, aller sur setup.html
  if(isSetup){
    window.location.replace('setup.html');
    return;
  }

  // Si un hash est présent, essayer de décoder la config
  if(hash){
    try{
      var cfg = JSON.parse(atob(hash));
      if(cfg.url && cfg.key){
        localStorage.setItem('cdm_sb_url', cfg.url);
        localStorage.setItem('cdm_sb_key', cfg.key);
        window.location.replace('login.html');
        return;
      }
    }catch(e){}
    // Hash invalide
    document.getElementById('invalid-screen').style.display='flex';
    return;
  }

  // Pas de hash : vérifier le localStorage
  var url = localStorage.getItem('cdm_sb_url');
  var key = localStorage.getItem('cdm_sb_key');
  if(url && key){
    window.location.replace('login.html');
    return;
  }

  // Rien du tout : afficher l'écran invalide
  document.getElementById('invalid-screen').style.display='flex';
})();
</script>
</body>
</html>
