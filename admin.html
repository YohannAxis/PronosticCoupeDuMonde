  const link = window.location.origin

      <i class="ti ti-qrcode"></i> Lien de partage &amp; QR Code
    </div>

async function adminSave(mid){
  const h=document.getElementById('ah-'+mid)?.value;
  const a=document.getElementById('aa-'+mid)?.value;
  if(h===''||a===''){toast('Saisissez les deux scores','ko');return}
  try{
    await sbPatch('matches',mid,{homescore:+h,awayscore:+a});
    if(st.matches?.[mid]){
      st.matches[mid].homeScore=+h;
      st.matches[mid].awayScore=+a;
      st.matches[mid].homescore=+h;
      st.matches[mid].awayscore=+a;
    }
    const n=await propagateResult(mid);
    toast(n>0?`Score + ${n} équipe(s) mise(s) à jour ✓`:'Score sauvegardé ✓','ok');
    renderAdmin();
  }catch(e){toast(e.message,'ko')}
}

// ── Propagation automatique des résultats ──────────────────
// Après un score : remplace les placeholders dans les matchs suivants
async function propagateResult(mid){
  const m=st.matches[mid];
  if(!m||m.homeScore==null)return 0;

  const num=parseInt(mid.replace('m',''));
  const hs=m.homeScore,as=m.awayScore;
  const winner=hs>as?m.home:as>hs?m.away:null; // null si match nul (prolongations)
  const loser =hs>as?m.away:as>hs?m.home:null;

  const updates=[];

  // 1. Phase éliminatoire : V.Mxx → vainqueur, Perdant Mxx → perdant
  if(winner){
    const wp='V.M'+num;
    const lp='Perdant M'+num;
    for(const [id,fm] of Object.entries(st.matches)){
      const nh=fm.home===wp?winner:fm.home===lp?loser:fm.home;
      const na=fm.away===wp?winner:fm.away===lp?loser:fm.away;
      if(nh!==fm.home||na!==fm.away)updates.push({id,home:nh,away:na});
    }
  }

  // 2. Fin de phase de groupe : 1er Gr.X / 2e Gr.X → équipes qualifiées
  if(m.phase?.startsWith('Groupe ')){
    const grp=m.phase;
    const letter=grp.replace('Groupe ','');
    const grpMs=getMatches().filter(x=>x.phase===grp);

    if(grpMs.every(x=>x.homeScore!=null)){
      // Calcul du classement
      const teams={};
      grpMs.forEach(gm=>{
        [gm.home,gm.away].forEach(t=>{if(!teams[t])teams[t]={n:t,pts:0,gd:0,gf:0}});
        const h=+gm.homeScore,a=+gm.awayScore;
        teams[gm.home].gf+=h;teams[gm.home].gd+=h-a;
        teams[gm.away].gf+=a;teams[gm.away].gd+=a-h;
        if(h>a){teams[gm.home].pts+=3}
        else if(h<a){teams[gm.away].pts+=3}
        else{teams[gm.home].pts++;teams[gm.away].pts++}
      });
      const sorted=Object.values(teams)
        .sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.n.localeCompare(b.n));

      const first=sorted[0]?.n, second=sorted[1]?.n;
      const fp='1er Gr.'+letter, sp='2e Gr.'+letter;

      for(const [id,fm] of Object.entries(st.matches)){
        if(fm.phase!=='16e de finale')continue;
        // Le placeholder peut être partiel, ex "1er Gr.A" est dans fm.home
        const nh=fm.home===fp?first:fm.home===sp?second:fm.home;
        const na=fm.away===fp?first:fm.away===sp?second:fm.away;
        if(nh!==fm.home||na!==fm.away){
          const ex=updates.find(u=>u.id===id);
          if(ex){ex.home=nh;ex.away=na}
          else updates.push({id,home:nh,away:na});
        }
      }
    }
  }

  // Appliquer les mises à jour en base
  for(const upd of updates){
    await sbPatch('matches',upd.id,{home:upd.home,away:upd.away});
    if(st.matches[upd.id]){
      st.matches[upd.id].home=upd.home;
      st.matches[upd.id].away=upd.away;
    }
  }
  return updates.length;
}

async function adminClear(mid){
  if(!confirm('Effacer ce score ?'))return;
  try{
    await sbPatch('matches',mid,{homescore:null,awayscore:null});
    if(st.matches?.[mid]){
      st.matches[mid].homeScore=null;
      st.matches[mid].awayScore=null;
      st.matches[mid].homescore=null;
      st.matches[mid].awayscore=null;
    }
    toast('Score effacé','ok');
    renderAdmin();
  }catch(e){toast(e.message,'ko')}
}

// ── Helpers API ───────────────────────────────────────────
function getApiKey(){return document.getElementById('api-key-input')?.value.trim()||''}
function saveApiKey(){const k=getApiKey();if(k)localStorage.setItem('cdm_api_key',k)}
function apiStatus(html,color='var(--t2)'){
  const el=document.getElementById('api-status');
  if(!el)return;
  el.innerHTML=html;el.style.color=color;el.style.display='block';
}
async function apiFetch(path){
  const key=getApiKey();
  if(!key)throw new Error('Clé API manquante');
  // Le navigateur bloque les appels directs vers football-data.org (CORS + header X-Auth-Token).
  // On passe par corsproxy.io qui relaie la requête côté serveur en conservant tous les headers.
  const target='https://api.football-data.org/v4'+path;
  const url='https://corsproxy.io/?'+encodeURIComponent(target);
  let r;
  try{
    r=await fetch(url,{headers:{'X-Auth-Token':key}});
  }catch(netErr){
    throw new Error('Proxy CORS injoignable — vérifie ta connexion internet ou réessaie dans quelques secondes.');
  }
  if(r.status===403)throw new Error('Clé API invalide ou accès refusé (403) — vérifie ton Auth Token sur football-data.org');
  if(r.status===429)throw new Error('Trop de requêtes — attends 1 minute (limite gratuite : 10 req/min)');
  if(!r.ok){const t=await r.text().catch(()=>'');throw new Error(`Erreur ${r.status}${t?' — '+t.slice(0,80):''}`);}
  return r.json();
}
// Normalise un nom d'équipe API vers le nom français de l'app
function apiToFr(name){
  return API_NAMES[name]||name;
}

// ── Test de connexion ──────────────────────────────────────
async function testApi(){
  const key=getApiKey();
  if(!key){apiStatus('⚠ Entrez votre clé API d\'abord.','#d97706');return}
  saveApiKey();
  apiStatus('<span class="spin" style="border-top-color:var(--g);border-color:rgba(0,0,0,.1);display:inline-block"></span> Test en cours…');

  try{
    // 1. Vérifie que la clé est valide en listant les compétitions disponibles
    const data=await apiFetch('/competitions');
    const comps=data.competitions||[];
    const wc=comps.find(c=>c.code==='WC');

    if(!wc){
      // Coupe du Monde pas encore dispo sur ce compte (tier gratuit peut ne pas l'inclure avant le tournoi)
      const names=comps.slice(0,6).map(c=>`${c.name} (${c.code})`).join(', ');
      apiStatus(
        `⚠ <strong>Connexion réussie</strong> mais la Coupe du Monde (WC) n'est pas accessible.<br>
        Compétitions disponibles : ${esc(names)}…<br>
        <em>La FIFA 2026 sera disponible dès le début du tournoi (11 juin 2026).</em>`,
        '#d97706'
      );
      return;
    }

    // 2. Infos sur la compétition WC
    const season=wc.currentSeason;
    const matchCount=await apiFetch('/competitions/WC/matches').then(d=>(d.matches||[]).length).catch(()=>'?');
    apiStatus(
      `✅ <strong>Connexion réussie !</strong><br>
      Coupe du Monde accessible · Saison ${season?.startDate?.slice(0,4)||'—'} → ${season?.endDate?.slice(0,4)||'—'}<br>
      ${matchCount} match(s) disponibles dans l'API`,
      'var(--g-d)'
    );
    toast('API connectée ✓','ok');

  }catch(e){
    apiStatus('❌ '+esc(e.message),'#dc2626');
    toast(e.message,'ko');
  }
}

// ── Import des scores ──────────────────────────────────────
async function importScores(){
  const key=getApiKey();
  if(!key){apiStatus('⚠ Entrez votre clé API d\'abord.','#d97706');return}
  saveApiKey();
  apiStatus('<span class="spin" style="border-top-color:var(--g);border-color:rgba(0,0,0,.1);display:inline-block"></span> Récupération des matchs terminés…');
  document.getElementById('api-preview').style.display='none';

  try{
    const data=await apiFetch('/competitions/WC/matches?status=FINISHED&season=2026');
    const apiMatches=data.matches||[];

    if(!apiMatches.length){
      apiStatus('ℹ Aucun match terminé trouvé pour FIFA 2026.<br><em>Le tournoi commence le 11 juin 2026.</em>','var(--t2)');
      return;
    }

    // Construire la liste des mises à jour
    const updates=[],notFound=[];
    for(const apiM of apiMatches){
      const hs=apiM.score?.fullTime?.home;
      const as=apiM.score?.fullTime?.away;
      if(hs==null||as==null)continue;

      const apiHome=apiToFr(apiM.homeTeam?.name||'');
      const apiAway=apiToFr(apiM.awayTeam?.name||'');

      // Chercher le match local par nom d'équipes
      const found=getMatches().find(m=>{
        const mh=m.home,ma=m.away;
        return(mh===apiHome&&ma===apiAway)||(mh===apiAway&&ma===apiHome);
      });

      if(!found){
        // Essai avec shortName
        const sh=apiToFr(apiM.homeTeam?.shortName||'');
        const sa=apiToFr(apiM.awayTeam?.shortName||'');
        const found2=getMatches().find(m=>(m.home===sh&&m.away===sa)||(m.home===sa&&m.away===sh));
        if(!found2){notFound.push(`${apiM.homeTeam?.name} vs ${apiM.awayTeam?.name}`);continue}
        const rh2=found2.home===sh;
        updates.push({id:found2.id,homescore:rh2?hs:as,awayscore:rh2?as:hs,
          label:`${found2.home} vs ${found2.away}`});
        continue;
      }

      // Déjà à jour ?
      const realHome=found.home===apiHome;
      const newH=realHome?hs:as, newA=realHome?as:hs;
      if(found.homeScore===newH&&found.awayScore===newA)continue;

      updates.push({id:found.id,homescore:newH,awayscore:newA,
        label:`${found.home} vs ${found.away}: ${newH}–${newA}`});
    }

    if(!updates.length){
      apiStatus(`✅ Tous les scores (${apiMatches.length} matchs terminés) sont déjà à jour !`,'var(--g-d)');
      return;
    }

    // Aperçu avant import
    const preview=document.getElementById('api-preview');
    preview.style.display='block';
    preview.innerHTML=`<div style="background:var(--g-l);border:1px solid var(--bd2);border-radius:8px;padding:10px 12px;font-size:.75rem">
      <strong style="color:var(--g-d)">${updates.length} score(s) à mettre à jour :</strong>
      <ul style="margin:6px 0 8px 14px;color:var(--t)">
        ${updates.map(u=>`<li>${esc(u.label)}</li>`).join('')}
      </ul>
      ${notFound.length?`<p style="color:#d97706">⚠ ${notFound.length} match(s) non trouvé(s) dans ta base</p>`:''}
      <button class="btn btn-primary btn-sm" onclick="applyImport()" style="margin-top:4px">
        <i class="ti ti-check"></i> Confirmer l'import
      </button>
    </div>`;
    window._pendingUpdates=updates;
    apiStatus(`${updates.length} score(s) prêts à importer — confirme ci-dessous.`,'var(--g-d)');

  }catch(e){
    apiStatus('❌ '+esc(e.message),'#dc2626');
    toast(e.message,'ko');
  }
}

// ── Appliquer les mises à jour confirmées ─────────────────
async function applyImport(){
  const updates=window._pendingUpdates||[];
  if(!updates.length)return;
  const preview=document.getElementById('api-preview');
  if(preview)preview.style.display='none';
  apiStatus('<span class="spin" style="border-top-color:var(--g);border-color:rgba(0,0,0,.1);display:inline-block"></span> Import en cours…');

  let done=0;
  for(const upd of updates){
    try{
      await sbPatch('matches',upd.id,{homescore:upd.homescore,awayscore:upd.awayscore});
      if(st.matches?.[upd.id]){
        st.matches[upd.id].homeScore=upd.homescore;
        st.matches[upd.id].awayScore=upd.awayscore;
        st.matches[upd.id].homescore=upd.homescore;
        st.matches[upd.id].awayscore=upd.awayscore;
      }
      await propagateResult(upd.id);
      done++;
    }catch(e){console.warn('Import error',upd.id,e)}
  }
  window._pendingUpdates=[];
  apiStatus(`✅ ${done} score(s) importé(s) avec succès !`,'var(--g-d)');
  toast(`${done} score(s) importé(s) ✓`,'ok');
  renderAdmin();
}

async function saveTeams(mid){
  const h=document.getElementById('ht-'+mid)?.value.trim();
  const a=document.getElementById('at-'+mid)?.value.trim();
  if(!h||!a){toast('Saisissez les deux noms d\'équipes','ko');return}
  try{
    await sbPatch('matches',mid,{home:h,away:a});
    if(st.matches?.[mid]){st.matches[mid].home=h;st.matches[mid].away=a}
    toast('Équipes mises à jour ✓','ok');
    renderAdmin();
  }catch(e){toast(e.message,'ko')}
}

async function saveBR(qid){
  const val=document.getElementById('br-'+qid)?.value.trim()||'';
  if(!st.bonusResults)st.bonusResults={};
  st.bonusResults[qid]=val;
  try{
    await sbUpsert('bonus_results',{id:qid,answer:val});
    toast('Résultat sauvegardé ✓','ok');
  }catch(e){toast(e.message,'ko')}
}

function copyLink(){
  const link=window._shareLink||'';
  navigator.clipboard.writeText(link)
    .then(()=>toast('Lien copié ✓','ok'))
    .catch(()=>{
      const prev=document.getElementById('link-preview');
      const val=document.getElementById('link-val');
      if(prev&&val){val.textContent=link;prev.style.display='block';}
      toast('Copiez le lien ci-dessous','ok');
    });
}

async function forceRefresh(){
  try{
    st=await sbReadAll();
    toast('Données rechargées ✓','ok');
    renderAdmin();
  }catch(e){toast(e.message,'ko')}
}
</script>
